<!DOCTYPE html>
<!-- Visual reference only. Not production code. Fonts in the real app are self-hosted. -->`n<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stuti · Desktop Demo</title>
<!-- Demo used Google Fonts; production uses @fontsource. -->`n<style>/* Stuti desktop: the hymnbook opened flat on a lectern. Leather spine bar on top, paper pages below,
   three panes = find (left page) · song (centre spread) · Sunday set (ribbon page). Present = the screen. */
:root{
  --leather: oklch(0.36 0.11 15); --leather-deep: oklch(0.27 0.08 15);
  --gold: oklch(0.80 0.12 82); --gold-soft: oklch(0.90 0.07 85);
  --ribbon: oklch(0.55 0.19 25); --ok: oklch(0.55 0.09 175);
  --paper: oklch(0.985 0.004 15); --page: oklch(0.997 0.002 15); --card: oklch(0.965 0.007 15);
  --ink: oklch(0.27 0.02 15); --muted: oklch(0.48 0.03 15); --line: oklch(0.91 0.012 15);
  --display: "Domine", Georgia, serif; --sans: "Instrument Sans", system-ui, sans-serif;
  --indic: "Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Gurmukhi", var(--sans);
}
body.dark{ --paper: oklch(0.19 0.015 15); --page: oklch(0.215 0.015 15); --card: oklch(0.25 0.02 15);
  --ink: oklch(0.93 0.01 60); --muted: oklch(0.74 0.02 40); --line: oklch(0.32 0.02 15); }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:600 12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--page)}
.lang-hi,.lang-ta,.lang-te,.lang-pa{font-family:var(--indic)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}

/* Top bar */
.bar{height:60px;background:var(--leather-deep);color:var(--gold-soft);display:flex;align-items:center;gap:24px;padding:0 20px 0 24px;position:relative;z-index:3}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font:700 26px/1 var(--display);color:var(--gold)}
.brand span{font-size:14px;color:oklch(0.85 0.05 70)}
.langs{display:flex;gap:6px;flex:1;justify-content:center}
.langs button{border:1px solid oklch(0.80 0.12 82 / .35);background:none;color:var(--gold-soft);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;min-height:36px;font-family:var(--indic)}
.langs button.on{background:var(--gold);border-color:var(--gold);color:var(--leather-deep)}
.baracts{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:oklch(0.85 0.07 175);padding:5px 10px;border-radius:999px;background:oklch(0.55 0.09 175 / .18);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:oklch(0.72 0.11 175)}
.barbtn{border:1px solid oklch(0.80 0.12 82 / .35);background:none;color:var(--gold-soft);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px;white-space:nowrap}
.barbtn.on{background:var(--ok);border-color:var(--ok);color:white}
#setbtn{display:none}

/* Panes */
.app{display:grid;grid-template-columns:310px minmax(0,1fr) 320px;height:calc(100vh - 60px)}
.pane{overflow-y:auto;scrollbar-width:thin}
#left{background:var(--page);border-right:1px solid var(--line);padding:18px 18px 28px}
#centre{padding:32px 44px 64px}
#right{background:var(--page);border-left:1px solid var(--line);padding:0 18px 24px;display:flex;flex-direction:column}

/* Left */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:14px;min-height:40px}
.seg button.on{background:var(--leather);color:var(--gold-soft)}
.seg.small{display:inline-grid;grid-template-columns:repeat(2,auto);margin:0;padding:3px}
.seg.small button{padding:6px 12px;min-height:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;min-height:36px}
.chip.on{background:var(--leather);border-color:var(--leather);color:var(--gold-soft)}
.display{margin:14px 0 12px;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:118px;justify-content:center;background:var(--page)}
.dbook{font-size:13px;color:var(--muted);font-weight:600}
.ddig{font:700 46px/1.1 var(--display);color:var(--leather);letter-spacing:.04em}
body.dark .ddig{color:var(--gold)}
.ph{color:oklch(0.72 0.02 15)}
.dmatch{font-size:14px;color:var(--muted);font-family:var(--indic);min-height:22px}
.dmatch span{color:var(--ink);font-weight:600;font-size:16px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.key{height:52px;border-radius:11px;border:0;background:var(--card);font:600 22px var(--sans);box-shadow:0 1px 0 var(--line)}
.key:active{transform:scale(.97)}
.key.soft{font-size:18px;color:var(--muted)}
.key.go{background:var(--ribbon);color:white;font-size:16px}
.key.go:disabled{opacity:.35;cursor:default}
.hint{font-size:14px;color:var(--muted);margin:12px 0 4px;text-align:center}
.q{width:100%;font:16px var(--indic);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
.label{font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.letters{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.letter{height:42px;border-radius:9px;border:1.5px solid var(--line);background:none;font:600 18px var(--indic)}
.letter.on{background:var(--leather);border-color:var(--leather);color:var(--gold-soft)}
.empty{color:var(--muted);font-size:15px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 8px;min-height:58px;border-radius:10px}
.row:hover{background:var(--card)}
.row.on{background:oklch(0.36 0.11 15 / .08);box-shadow:inset 3px 0 0 var(--ribbon)}
.rt{display:flex;flex-direction:column;min-width:0;flex:1}
.rt .t{font-weight:600;font-size:16px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:14px;margin:0}
.num{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:50px;height:46px;border-radius:8px;background:var(--leather);color:var(--gold);font:700 18px/1 var(--display);flex:none}
.num small{font:700 12px/1 var(--sans);letter-spacing:.06em;color:var(--gold-soft);opacity:.85;margin-bottom:3px}
.num.big{min-width:92px;height:84px;font-size:36px;border-radius:12px}
.num.big small{font-size:14px}

/* Centre: song */
.songtop,.toolbar,.lyrics,.meta{max-width:1120px;margin-left:auto;margin-right:auto}
.songtop{display:flex;align-items:center;gap:22px}
.titles{flex:1;min-width:0}
.titles h1{font:700 36px/1.25 var(--display);margin:0;letter-spacing:-.01em}
.titles h1.lang-hi,.titles h1.lang-ta,.titles h1.lang-te,.titles h1.lang-pa{font-family:var(--indic);font-weight:700;font-size:34px}
.titles .sub{font-size:17px;margin-top:4px}
.topacts{display:flex;gap:10px;align-items:center}
.icon{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--page);font-size:22px}
.icon.starred{color:var(--gold);background:var(--leather);border-color:var(--leather)}
.present{border:0;background:var(--ribbon);color:white;border-radius:12px;padding:0 20px;height:48px;font-weight:700;font-size:16px;box-shadow:0 6px 16px -8px oklch(0.55 0.19 25 / .7)}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:22px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:-36px;background:var(--paper);z-index:2}
.group{display:flex;gap:6px;align-items:center}
.tool{border:1px solid var(--line);background:var(--page);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px;min-height:38px}
.tool.ok{background:var(--ok);border-color:var(--ok);color:white}
.lyrics{margin-top:26px;font-size:var(--fs)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:32px;row-gap:14px;align-items:baseline}
.grid.heads{margin-bottom:6px;row-gap:0;padding:0 14px 0 21px}
.grid[style*="--cols:3"]{grid-template-columns:1.35fr 1fr 1fr}
.grid[style*="--cols:2"]{grid-template-columns:1.2fr 1fr}
.grid.heads span{font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:2px solid var(--line)}
.sec{margin:0 0 28px;padding:6px 14px 6px 18px;border-left:3px solid transparent}
.sec.chorus{border-left-color:var(--ribbon);background:oklch(0.55 0.19 25 / .045);border-radius:0 10px 10px 0;padding-right:14px}
.sec h4{margin:0 0 10px;font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ribbon)}
.c.n,.line .n{font-weight:500;line-height:1.7}
.c.r,.line .r{color:var(--muted);font-size:.86em;line-height:1.55}
.c.e,.line .e{color:var(--muted);font-style:italic;font-size:.8em;line-height:1.55}
.stack .line{display:flex;flex-direction:column;margin-bottom:14px}
.again{margin-top:10px;font-size:14px;font-weight:600;color:var(--ribbon)}
.meta{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 32px;font-size:15px;align-items:center}
.meta .k{color:var(--muted);font-weight:600;margin-right:8px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.ok{background:oklch(0.55 0.09 175 / .15);color:var(--ok)}
.badge.demo{background:oklch(0.80 0.12 82 / .28);color:oklch(0.45 0.09 70)}
body.dark .badge.demo{color:var(--gold)}
.report{margin-left:auto;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:8px 14px;color:var(--muted);font-weight:600;font-size:14px}

/* Right: Sunday set (the ribbon page) */
.sethead{position:relative;margin:0 -18px 8px;padding:20px 18px 18px 56px;background:linear-gradient(135deg,var(--ribbon),oklch(0.46 0.17 22));color:oklch(0.98 0.01 60)}
.sethead .k{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85}
.sethead h2{margin:2px 0;font:700 24px/1.2 var(--display)}
.sethead .sub{color:oklch(0.95 0.02 40);opacity:.85}
.ribbon-tail{position:absolute;left:22px;top:0;width:16px;height:70px;background:var(--gold);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);animation:sway 6s ease-in-out infinite;transform-origin:top center}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
.setlist{flex:1}
.setrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 4px;border-radius:10px}
.setrow.on{background:oklch(0.36 0.11 15 / .08)}
.ord{font:700 18px var(--display);color:var(--ribbon);width:20px;text-align:center;flex:none}
.setopen{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0}
.setopen .num{min-width:44px;height:42px;font-size:16px}
.mv{display:none;flex-direction:row;gap:2px}
.setrow:hover .mv,.setrow:focus-within .mv{display:flex}
.rt .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv button{border:0;background:none;color:var(--muted);font-size:12px;width:26px;height:30px;border-radius:6px}
.mv button:hover{background:var(--card)}
.mv button:disabled{opacity:.25}
.setacts{display:grid;gap:8px;margin-top:16px}
.primary{border:0;background:var(--ribbon);color:white;border-radius:12px;padding:12px;font-weight:700;min-height:48px}
.secondary{border:1.5px solid var(--leather);background:none;border-radius:12px;padding:12px;font-weight:700;min-height:48px}
.primary:disabled,.secondary:disabled{opacity:.4}
.kbd{margin-top:20px;font-size:14px;color:var(--muted)}
.kbd .label{margin:0 0 6px}
.kbd p{margin:0;line-height:2}

/* Present mode */
#overlay .pv{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 120% at 50% 0%, oklch(0.31 0.09 15), oklch(0.18 0.05 15));color:var(--gold-soft);display:flex;flex-direction:column;animation:fade .25s}
.pvtop{display:flex;align-items:center;gap:16px;padding:22px 32px}
.pvt{font:700 22px var(--display);color:var(--gold)}
.pvt.lang-hi,.pvt.lang-ta,.pvt.lang-te,.pvt.lang-pa{font-family:var(--indic)}
.pvl{font:700 14px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:oklch(0.75 0.13 30);margin-left:8px}
.pvx{margin-left:auto;border:1px solid oklch(0.80 0.12 82 / .35);background:none;color:var(--gold-soft);border-radius:10px;padding:8px 14px;font-weight:600}
.pvbody{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 6vw;gap:2.2vh}
.pline{display:flex;flex-direction:column;gap:.3vh}
.pn{font-size:clamp(30px,4.4vw,74px);font-weight:600;line-height:1.35;color:oklch(0.97 0.02 85)}
.pr{font-size:clamp(18px,2.1vw,34px);color:var(--gold);line-height:1.4}
.pe{font-size:clamp(16px,1.7vw,28px);color:oklch(0.82 0.04 70);font-style:italic}
.pvbot{display:flex;align-items:center;gap:18px;padding:18px 32px 26px}
.pvbot button{width:56px;height:56px;border-radius:50%;border:1px solid oklch(0.80 0.12 82 / .35);background:none;color:var(--gold);font-size:30px;line-height:1}
.dots{display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:oklch(0.80 0.12 82 / .3)}
.dots i.on{background:var(--gold);width:26px;border-radius:5px}
.nx{margin-left:auto;font-size:16px;color:oklch(0.85 0.05 70)}

/* Modals, toast */
.scrim{position:fixed;inset:0;background:oklch(0.2 0.03 15 / .45);z-index:10;animation:fade .2s}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;background:var(--page);border-radius:18px;padding:24px 28px;width:min(420px,92vw);text-align:center;box-shadow:0 30px 60px -20px oklch(0.2 0.05 15 / .5);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.modal h3{font:700 22px var(--display);margin:0 0 14px}
.qr{display:inline-block;background:white;padding:10px;border-radius:12px;border:1px solid var(--line)}
.qr svg{display:block;width:200px;height:200px}
.link{font:600 15px ui-monospace,Menlo,monospace;margin:12px 0 4px}
.modal .sub{margin-bottom:16px}
.modal .primary{width:100%}
.fl{display:flex;flex-direction:column;text-align:left;font-size:13px;font-weight:700;color:var(--muted);gap:6px;margin-bottom:12px}
.fl select,.fl textarea{font:15px var(--indic);padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}
@media (hover:none){.mv{display:flex}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Laptop 1024-1279: set becomes a drawer */
@media (max-width:1279px){
  .app{grid-template-columns:320px minmax(0,1fr)}
  #right{position:fixed;right:0;top:60px;bottom:0;width:340px;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:5;box-shadow:-20px 0 40px -20px oklch(0.2 0.05 15 / .35)}
  body.setopen #right{transform:none}
  #setbtn{display:inline-block}
  #centre{padding:28px 36px 56px}
  .brand span,.pill{display:none}
}
/* Tablet/phone fallback */
@media (max-width:899px){
  body{overflow:auto}
  .app{display:block;height:auto}
  #left{border-right:0;border-bottom:1px solid var(--line)}
  #centre{padding:24px 18px 48px}
  .langs{display:none}
  .grid{grid-template-columns:1fr;row-gap:4px}
  .grid.heads{display:none}
  .titles h1{font-size:28px}
}

/* Print / PDF: just the song */
@media print{
  .bar,#left,#right,.toolbar,.topacts,.report,#overlay,#toast{display:none!important}
  body{overflow:visible;background:white;color:black}
  .app{display:block;height:auto}
  #centre{padding:0;overflow:visible}
  .sec.chorus{background:none}
}
</style>

        <div class="chips">${topics.map((t) => `<button type="button" class="chip ${st.topic === t ? "on" : ""}" data-topic="${t}">${t}</button>`).join("")}</div>
        <h3 class="label">${shown.length} songs</h3>
        ${shown.map((s) => row(s, s.id === st.song)).join("")}`;
    }
    return tabs + `<div class="lbody">${body}</div>`;
  }

  // ---------- Centre: song ----------
  function centre() {
    const s = byId[st.song];
    const single = s.lang === "en";
    const L = single ? { n: true, r: false, e: false } : st.layers;
    const keys = ["n", "r", "e"].filter((k) => L[k]);
    const heads = { n: single ? "English" : LANG_NAME[s.lang], r: "Roman", e: "English meaning" };
    const cols = st.cols && keys.length > 1;
    const lyr = s.sections.map((sec, si) => {
      const chorusMark = sec.label !== "Chorus" && s.sections.some((x) => x.label === "Chorus") && si > 0 ? `<div class="again">↻ Chorus</div>` : "";
      return `<section class="sec ${sec.label === "Chorus" ? "chorus" : ""}">
        <h4>${sec.label}</h4>
        <div class="${cols ? "grid" : "stack"}" style="--cols:${keys.length}">
          ${sec.lines.map((l) => cols
            ? keys.map((k) => `<span class="c ${k}${k === "n" ? " lang-" + s.lang : ""}">${esc(l[{ n: 0, r: 1, e: 2 }[k]])}</span>`).join("")
            : `<div class="line">${keys.map((k) => `<span class="${k}${k === "n" ? " lang-" + s.lang : ""}">${esc(l[{ n: 0, r: 1, e: 2 }[k]])}</span>`).join("")}</div>`).join("")}
        </div>${chorusMark}</section>`;
    }).join("");
    const inSet = st.set.includes(s.id);
    return `
    <div class="songtop">
      ${badge(s, true)}
      <div class="titles">
        <h1 class="lang-${s.lang}">${esc(s.title[0])}</h1>
        <p class="sub">${single ? esc(bookOf(s.book).name) : esc(s.title[1]) + " · " + esc(s.title[2])}</p>
      </div>
      <div class="topacts">
        <button type="button" class="icon ${st.favs.has(s.id) ? "starred" : ""}" data-fav title="Favourite">${st.favs.has(s.id) ? "★" : "☆"}</button>
        <button type="button" class="present" data-present="song" title="Present (P)">▶ Present</button>
      </div>
    </div>
    <div class="toolbar">
      ${single ? "" : `<div class="group" role="group" aria-label="Layers">
        <button type="button" class="chip ${L.n ? "on" : ""}" data-layer="n">${LANG_NAME[s.lang]}</button>
        <button type="button" class="chip ${L.r ? "on" : ""}" data-layer="r">Roman</button>
        <button type="button" class="chip ${L.e ? "on" : ""}" data-layer="e">English</button></div>
      <div class="group seg small">
        <button type="button" class="${st.cols ? "on" : ""}" data-cols="1" title="Side by side">▥ Columns</button>
        <button type="button" class="${!st.cols ? "on" : ""}" data-cols="0" title="Stacked">☰ Stacked</button></div>`}
      <div class="group">
        <button type="button" class="tool" data-size="-1" aria-label="Smaller">A−</button>
        <button type="button" class="tool" data-size="1" aria-label="Bigger">A+</button></div>
      <div class="group">
        <button type="button" class="tool ${inSet ? "ok" : ""}" data-addset>${inSet ? "✓ In set" : "+ Set"}</button>
        <button type="button" class="tool" data-share>Share</button>
        <button type="button" class="tool" data-pdf>PDF</button>
        <button type="button" class="tool" data-ppt>PPT</button></div>
    </div>
    <div class="lyrics" style="--fs:${SIZES[st.size]}px">
      ${cols ? `<div class="grid heads" style="--cols:${keys.length}">${keys.map((k) => `<span>${heads[k]}</span>`).join("")}</div>` : ""}
      ${lyr}
    </div>
    <div class="meta">
      <div><span class="k">Author</span>${esc(s.author)}${s.year ? ", " + s.year : ""}</div>
      <div><span class="k">Book</span>${esc(bookOf(s.book).name)} · No. ${s.no}</div>
      <div><span class="k">Bible</span>${s.refs.join(", ")}</div>
      <div><span class="k">Rights</span>${s.rights === "public_domain" ? '<span class="badge ok">Public domain</span>' : '<span class="badge demo">Demo text</span>'}</div>
      <button type="button" class="report" data-report>Report a mistake</button>
    </div>`;
  }

  // ---------- Right pane: set ----------
  function right() {
    return `<div class="sethead">
        <span class="ribbon-tail" aria-hidden="true"></span>
        <div><p class="k">This Sunday</p><h2>Sunday set</h2><p class="sub">${st.set.length} songs · 22 Nov</p></div>
      </div>
      <div class="setlist">
        ${st.set.map((id, i) => {
          const s = byId[id];
          return `<div class="setrow ${id === st.song ? "on" : ""}">
            <span class="ord">${i + 1}</span>
            <button type="button" class="setopen" data-open="${id}">${badge(s)}<span class="rt"><span class="t lang-${s.lang}">${esc(s.title[0])}</span><span class="sub">${s.lang === "en" ? "" : esc(s.title[1])}</span></span></button>
            <span class="mv">
              <button type="button" data-mv="${i}:-1" aria-label="Up" ${i === 0 ? "disabled" : ""}>▲</button>
              <button type="button" data-mv="${i}:1" aria-label="Down" ${i === st.set.length - 1 ? "disabled" : ""}>▼</button>
              <button type="button" data-rm="${i}" aria-label="Remove">✕</button></span>
          </div>`;
        }).join("") || '<p class="empty">Open a song and press <b>+ Set</b>.</p>'}
      </div>
      <div class="setacts">
        <button type="button" class="primary" data-present="set" ${st.set.length ? "" : "disabled"}>▶ Present set</button>
        <button type="button" class="secondary" data-qr ${st.set.length ? "" : "disabled"}>QR for congregation</button>
      </div>
      <div class="kbd">
        <p class="label">Shortcuts</p>
        <p><kbd>0-9</kbd> hymn number · <kbd>/</kbd> search · <kbd>P</kbd> present · <kbd>←</kbd><kbd>→</kbd> slides · <kbd>Esc</kbd> exit</p>
      </div>`;
  }

  // ---------- Present mode ----------
  function slidesFor(id) {
    const s = byId[id];
    return s.sections.map((sec) => ({ id, label: sec.label, lines: sec.lines }));
  }
  function presentHTML() {
    const p = st.present;
    const id = p.list[p.si];
    const s = byId[id];
    const slides = slidesFor(id);
    const sl = slides[p.slide];
    const nextLabel = p.slide < slides.length - 1 ? slides[p.slide + 1].label : p.si < p.list.length - 1 ? "Next song: " + byId[p.list[p.si + 1]].title[0] : "End";
    const L = s.lang === "en" ? { n: true, r: false, e: false } : st.layers;
    return `<div class="pv" role="dialog" aria-label="Presentation">
      <div class="pvtop">${badge(s)}<span class="pvt lang-${s.lang}">${esc(s.title[0])}</span><span class="pvl">${sl.label}</span>
        <button type="button" class="pvx" data-exit>Esc · Exit</button></div>
      <div class="pvbody">
        ${sl.lines.map((l) => `<div class="pline">${L.n ? `<span class="pn lang-${s.lang}">${esc(l[0])}</span>` : ""}${L.r && l[1] ? `<span class="pr">${esc(l[1])}</span>` : ""}${L.e && l[2] ? `<span class="pe">${esc(l[2])}</span>` : ""}</div>`).join("")}
      </div>
      <div class="pvbot">
        <button type="button" data-slide="-1" aria-label="Previous">‹</button>
        <span class="dots">${slides.map((_, i) => `<i class="${i === p.slide ? "on" : ""}"></i>`).join("")}</span>
        <span class="nx">${p.list.length > 1 ? `Song ${p.si + 1}/${p.list.length} · ` : ""}Next: ${esc(nextLabel)}</span>
        <button type="button" data-slide="1" aria-label="Next">›</button>
      </div></div>`;
  }
  function stepSlide(d) {
    const p = st.present;
    const n = slidesFor(p.list[p.si]).length;
    if (d > 0) {
      if (p.slide < n - 1) p.slide++;
      else if (p.si < p.list.length - 1) { p.si++; p.slide = 0; }
    } else {
      if (p.slide > 0) p.slide--;
      else if (p.si > 0) { p.si--; p.slide = slidesFor(p.list[p.si]).length - 1; }
    }
    st.song = p.list[p.si];
    render();
  }
  async function startPresent(kind) {
    st.present = kind === "set" ? { list: [...st.set], si: Math.max(0, st.set.indexOf(st.song)), slide: 0 } : { list: [st.song], si: 0, slide: 0 };
    if (kind === "set" && !st.set.includes(st.song)) st.present.si = 0;
    try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
    render();
  }
  function stopPresent() {
    st.present = null;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    render();
  }

  // ---------- Modals ----------
  function modal() {
    if (st.modal === "qr") return `<div class="modal" role="dialog" aria-label="Share set"><h3>Scan to follow this set</h3><div class="qr">${window.__QR__}</div>
      <p class="link">stuti.pages.dev/set/sunday-demo</p><p class="sub">Example link. Put it on the church screen or bulletin.</p>
      <button type="button" class="primary" data-close>Done</button></div>`;
    if (st.modal === "report") {
      const s = byId[st.song];
      return `<div class="modal" role="dialog" aria-label="Report"><h3>What's wrong?</h3>
        <label class="fl">Line<select>${s.sections.flatMap((x) => x.lines.map((l) => `<option>${esc(x.label + ": " + l[0])}</option>`)).join("")}</select></label>
        <label class="fl">Correction<textarea rows="3" placeholder="Type the right words"></textarea></label>
        <button type="button" class="primary" data-sent>Send to editors</button></div>`;
    }
    return "";
  }

  function render() {
    document.body.classList.toggle("dark", st.dark);
    document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === st.lang));
    $("#wake").classList.toggle("on", st.wake);
    $("#wake").textContent = st.wake ? "☀ Screen on" : "☀ Keep awake";
    $("#left").innerHTML = left();
    $("#centre").innerHTML = centre();
    $("#right").innerHTML = right();
    $("#overlay").innerHTML = st.present ? presentHTML() : st.modal ? `<div class="scrim" data-close></div>${modal()}` : "";
    document.body.classList.toggle("presenting", !!st.present);
    const q = $("#q");
    if (q && document.activeElement !== q && st.tab === "words" && st._focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); st._focusQ = false; }
  }

  function open(id) { st.song = id; render(); $("#centre").scrollTop = 0; }

  document.addEventListener("click", async (ev) => {
    const t = ev.target.closest("button, .scrim");
    if (!t) return;
    const d = t.dataset;
    if (d.lang) { st.lang = d.lang; st.letter = null; st.topic = null; render(); return; }
    if (d.tab) { st.tab = d.tab; st._focusQ = d.tab === "words"; render(); return; }
    if (d.book) { st.book = d.book; st.digits = ""; render(); return; }
    if (d.key) {
      if (d.key === "del") st.digits = st.digits.slice(0, -1);
      else if (d.key === "go") { const m = SONGS.find((s) => s.book === st.book && String(s.no) === st.digits); if (m) { st.digits = ""; open(m.id); return; } }
      else if (st.digits.length < 4) st.digits += d.key;
      render(); return;
    }
    if (d.letter) { st.letter = st.letter === d.letter ? null : d.letter; render(); return; }
    if (d.topic) { st.topic = st.topic === d.topic ? null : d.topic; render(); return; }
    if (d.open) { open(d.open); return; }
    if ("fav" in d) { st.favs.has(st.song) ? st.favs.delete(st.song) : st.favs.add(st.song); render(); return; }
    if (d.layer) { const L = st.layers; L[d.layer] = !L[d.layer]; if (!L.n && !L.r && !L.e) L[d.layer] = true; render(); return; }
    if (d.cols) { st.cols = d.cols === "1"; render(); return; }
    if (d.size) { st.size = Math.max(0, Math.min(SIZES.length - 1, st.size + Number(d.size))); render(); return; }
    if ("addset" in d) { st.set.includes(st.song) ? (st.set = st.set.filter((x) => x !== st.song)) : st.set.push(st.song); render(); return; }
    if ("share" in d) { try { await navigator.clipboard.writeText("https://stuti.pages.dev/song/" + st.song.toLowerCase() + "/"); } catch (e) {} toast("Song link copied"); return; }
    if ("pdf" in d) { window.print(); return; }
    if ("ppt" in d) { toast("PPT export: one slide per verse, built in the real app"); return; }
    if (d.mv) { const [i, dir] = d.mv.split(":").map(Number); [st.set[i], st.set[i + dir]] = [st.set[i + dir], st.set[i]]; render(); return; }
    if (d.rm) { st.set.splice(Number(d.rm), 1); render(); return; }
    if (d.present) { startPresent(d.present); return; }
    if ("exit" in d) { stopPresent(); return; }
    if (d.slide) { stepSlide(Number(d.slide)); return; }
    if ("qr" in d) { st.modal = "qr"; render(); return; }
    if ("report" in d) { st.modal = "report"; render(); return; }
    if ("sent" in d) { st.modal = null; render(); toast("Sent for review (demo: nothing was sent)"); return; }
    if ("close" in d) { st.modal = null; render(); return; }
    if ("dark" in d) { st.dark = !st.dark; render(); return; }
    if (t.id === "setbtn") { document.body.classList.toggle("setopen"); return; }
    if (t.id === "wake") {
      st.wake = !st.wake;
      try { if (st.wake && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!st.wake && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
      render(); return;
    }
  });

  document.addEventListener("input", (ev) => {
    if (ev.target.id === "q") {
      st.q = ev.target.value;
      const res = search(st.q).filter(inLang);
      $("#res").innerHTML = st.q ? (res.length ? res.map((s) => row(s, s.id === st.song)).join("") : '<p class="empty">No match. Report a missing song?</p>') : "";
    }
  });

  document.addEventListener("keydown", (ev) => {
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
    if (st.present) {
      if (["ArrowRight", " ", "PageDown"].includes(ev.key)) { ev.preventDefault(); stepSlide(1); }
      else if (["ArrowLeft", "PageUp"].includes(ev.key)) { ev.preventDefault(); stepSlide(-1); }
      else if (ev.key === "Escape") stopPresent();
      return;
    }
    if (ev.key === "Escape" && st.modal) { st.modal = null; render(); return; }
    if (typing) return;
    if (/^[0-9]$/.test(ev.key)) { st.tab = "number"; if (st.digits.length < 4) st.digits += ev.key; render(); return; }
    if (ev.key === "Backspace" && st.tab === "number") { st.digits = st.digits.slice(0, -1); render(); return; }
    if (ev.key === "Enter" && st.tab === "number") { document.querySelector('[data-key="go"]')?.click(); return; }
    if (ev.key === "/") { ev.preventDefault(); st.tab = "words"; st._focusQ = true; render(); return; }
    if (ev.key === "p" || ev.key === "P") { startPresent("song"); return; }
  });
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && st.present) { st.present = null; render(); } });

  render();
})();
</script>
