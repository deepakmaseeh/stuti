name = "stuti"
main = "workers/report.ts"
compatibility_date = "2026-11-19"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Optional Cloudflare rate-limit binding (20 / 60s per IP). Safe to omit locally.
[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
APP_ORIGIN = "https://stuti.deepakmaseeh121.workers.dev"
