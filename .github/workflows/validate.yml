name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Real TLBC catalog — do not enable PUBLIC_INCLUDE_DEMO in production
    steps:
      - uses: actions/checkout@v4
      - name: Independence check (no references to the drafting tool)
        run: |
          if git grep -n -i "click""up" -- . ':!STUTI_FIXES_AND_LAUNCH.md' ':!STUTI_BUILD_SPEC.md' ':!STUTI_SETLISTS_AND_FIXES.md' ':!AGENTS.md'; then
            echo "Found a reference to the drafting tool. The app must be independent."; exit 1
          fi
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Content tools tests (Python, stdlib only)
        run: python3 -m unittest discover -s tools/tests -v
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm run check-precache
      - run: npm run check-budgets
      - run: npm run check-safety
      - run: npx lhci autorun
      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
